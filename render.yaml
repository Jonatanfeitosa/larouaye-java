# Blueprint do Render (opcional): "New > Blueprint" lê este arquivo.
services:
  - type: web
    name: larouaye-api
    runtime: docker
    plan: free
    healthCheckPath: /api/saude
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CLASSIFICADOR_URL
        sync: false
